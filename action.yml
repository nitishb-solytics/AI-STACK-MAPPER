name: AI Stack Mapper
description: Scan Python repositories for AI stack components, code assessment risks, or both.

inputs:
  path:
    description: Repository directory to scan.
    required: false
    default: "."

  mode:
    description: stack, risk, or both.
    required: false
    default: "both"

  markdown-output:
    description: Stack inventory Markdown report path.
    required: false
    default: "AI_STACK.md"

  json-output:
    description: Stack inventory JSON report path.
    required: false
    default: "ai-stack-report.json"

  scanner-mode:
    description: Inventory scanner mode for stack reports. Use static, llm, or hybrid.
    required: false
    default: "static"

  risk-output:
    description: Code assessment risk Markdown report path.
    required: false
    default: "AI_RISK_REPORT.md"

  risk-json-output:
    description: Code assessment risk JSON report path.
    required: false
    default: "ai-risk-report.json"

  risk-report-title:
    description: Title used in the Markdown/JSON risk report.
    required: false
    default: "AI Risk Report"

  changed-only:
    description: Scan only changed Python files for PR quality-gate/risk mode.
    required: false
    default: "false"

  base-ref:
    description: Base ref for changed-only risk scan mode.
    required: false
    default: ""

  fail-on:
    description: Severity threshold that fails the risk scan / PR quality gate.
    required: false
    default: "high"

  risk-no-fail:
    description: Always exit successfully after writing risk reports.
    required: false
    default: "false"

  enrich:
    description: Enable optional LLM enrichment for the stack inventory report.
    required: false
    default: "false"

  llm-risk-control:
    description: Enable optional LLM-generated controls for statically detected risk findings.
    required: false
    default: "false"

  risk-llm-max-findings:
    description: Maximum number of risk findings to send to the LLM for control generation.
    required: false
    default: "25"

  risk-llm-min-severity:
    description: Minimum risk severity sent to the LLM for control generation. Use info, low, medium, high, or critical.
    required: false
    default: "high"

  llm-api-key:
    description: API key for optional LLM features. Pass with a GitHub Actions secret.
    required: false
    default: ""

  llm-base-url:
    description: OpenAI-compatible chat-completions base URL.
    required: false
    default: ""

  llm-model:
    description: Model name used for optional LLM features.
    required: false
    default: "gpt-4o-mini"

runs:
  using: composite
  steps:
    - name: Install AI Stack Mapper engine
      shell: bash
      run: python -m pip install "${{ github.action_path }}/engine"

    - name: Generate stack inventory report
      if: ${{ inputs.mode == 'stack' || inputs.mode == 'both' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        MARKDOWN_OUTPUT: ${{ inputs.markdown-output }}
        JSON_OUTPUT: ${{ inputs.json-output }}
        SCANNER_MODE: ${{ inputs.scanner-mode }}
        INPUT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        AI_STACK_USE_LLM: ${{ inputs.enrich }}
        AI_STACK_SCANNER_MODE: ${{ inputs.scanner-mode }}
        AI_STACK_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        AI_STACK_LLM_MODEL: ${{ inputs.llm-model }}
        AI_STACK_ENV_FILE: ""
      run: |
        if [ -n "$INPUT_LLM_API_KEY" ]; then
          export AI_STACK_LLM_API_KEY="$INPUT_LLM_API_KEY"
        fi
        args=(--path "$SCAN_PATH" --scanner-mode "$SCANNER_MODE" --markdown-output "$MARKDOWN_OUTPUT" --json-output "$JSON_OUTPUT")
        if [ "$AI_STACK_USE_LLM" = "true" ]; then
          args+=(--enrich)
        fi
        ai-stack-scan "${args[@]}"

    - name: Run code assessment risk scan
      if: ${{ inputs.mode == 'risk' || inputs.mode == 'both' }}
      shell: bash
      env:
        RISK_PATH: ${{ inputs.path }}
        RISK_OUTPUT: ${{ inputs.risk-output }}
        RISK_JSON_OUTPUT: ${{ inputs.risk-json-output }}
        RISK_REPORT_TITLE: ${{ inputs.risk-report-title }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        BASE_REF: ${{ inputs.base-ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        RISK_NO_FAIL: ${{ inputs.risk-no-fail }}
        LLM_RISK_CONTROL: ${{ inputs.llm-risk-control }}
        RISK_LLM_MAX_FINDINGS: ${{ inputs.risk-llm-max-findings }}
        RISK_LLM_MIN_SEVERITY: ${{ inputs.risk-llm-min-severity }}
        INPUT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        AI_STACK_USE_LLM: ${{ inputs.llm-risk-control }}
        AI_STACK_RISK_LLM_MAX_FINDINGS: ${{ inputs.risk-llm-max-findings }}
        AI_STACK_RISK_LLM_MIN_SEVERITY: ${{ inputs.risk-llm-min-severity }}
        AI_STACK_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        AI_STACK_LLM_MODEL: ${{ inputs.llm-model }}
        AI_STACK_ENV_FILE: ""
      run: |
        if [ -n "$INPUT_LLM_API_KEY" ]; then
          export AI_STACK_LLM_API_KEY="$INPUT_LLM_API_KEY"
        fi
        if [ "$LLM_RISK_CONTROL" = "true" ]; then
          export AI_STACK_USE_LLM="true"
        fi
        args=(--path "$RISK_PATH" --markdown-output "$RISK_OUTPUT" --json-output "$RISK_JSON_OUTPUT" --report-title "$RISK_REPORT_TITLE" --fail-on "$FAIL_ON")
        if [ "$CHANGED_ONLY" = "true" ]; then
          args+=(--changed-only)
        fi
        if [ -n "$BASE_REF" ]; then
          args+=(--base-ref "$BASE_REF")
        fi
        if [ "$RISK_NO_FAIL" = "true" ]; then
          args+=(--no-fail)
        fi
        if [ "$LLM_RISK_CONTROL" = "true" ]; then
          args+=(--llm-risk-control)
          args+=(--risk-llm-max-findings "$RISK_LLM_MAX_FINDINGS")
          args+=(--risk-llm-min-severity "$RISK_LLM_MIN_SEVERITY")
        fi
        ai-risk-scan "${args[@]}"
