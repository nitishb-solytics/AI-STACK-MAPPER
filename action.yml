name: AI Stack Mapper
description: Scan Python repositories for AI stack usage and optionally run an AI quality gate.

inputs:
  path:
    description: Repository directory to scan or review.
    required: false
    default: "."

  mode:
    description: scan, review, or both.
    required: false
    default: "both"

  markdown-output:
    description: Stack inventory Markdown report path.
    required: false
    default: "AI_STACK.md"

  json-output:
    description: Stack inventory JSON report path.
    required: false
    default: "ai-stack-report.json"

  quality-output:
    description: AI quality gate Markdown report path.
    required: false
    default: "ai-quality-report.md"

  quality-json-output:
    description: AI quality gate JSON report path.
    required: false
    default: "ai-quality-report.json"

  changed-only:
    description: Review only changed Python files for quality-gate mode.
    required: false
    default: "false"

  base-ref:
    description: Base ref for changed-only review mode.
    required: false
    default: ""

  fail-on:
    description: Severity threshold that fails the quality gate.
    required: false
    default: "high"

  enrich:
    description: Enable optional LLM enrichment for the stack inventory report.
    required: false
    default: "false"

  llm-review:
    description: Enable optional LLM quality review in addition to static quality rules.
    required: false
    default: "false"

  llm-api-key:
    description: API key for optional LLM features. Pass with a GitHub Actions secret.
    required: false
    default: ""

  llm-base-url:
    description: OpenAI-compatible chat-completions base URL.
    required: false
    default: ""

  llm-model:
    description: Model name used for optional LLM features.
    required: false
    default: "gpt-4o-mini"

runs:
  using: composite
  steps:
    - name: Install AI Stack Mapper engine
      shell: bash
      run: python -m pip install "${{ github.action_path }}/engine"

    - name: Generate stack inventory report
      if: ${{ inputs.mode == 'scan' || inputs.mode == 'both' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        MARKDOWN_OUTPUT: ${{ inputs.markdown-output }}
        JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        AI_STACK_USE_LLM: ${{ inputs.enrich }}
        AI_STACK_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        AI_STACK_LLM_MODEL: ${{ inputs.llm-model }}
        AI_STACK_ENV_FILE: ""
      run: |
        if [ -n "$INPUT_LLM_API_KEY" ]; then
          export AI_STACK_LLM_API_KEY="$INPUT_LLM_API_KEY"
        fi
        ai-stack-scan --path "$SCAN_PATH" --format markdown --output "$MARKDOWN_OUTPUT"
        ai-stack-scan --path "$SCAN_PATH" --format json --output "$JSON_OUTPUT"

    - name: Run AI quality gate
      if: ${{ inputs.mode == 'review' || inputs.mode == 'both' }}
      shell: bash
      env:
        REVIEW_PATH: ${{ inputs.path }}
        QUALITY_OUTPUT: ${{ inputs.quality-output }}
        QUALITY_JSON_OUTPUT: ${{ inputs.quality-json-output }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        BASE_REF: ${{ inputs.base-ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        LLM_REVIEW: ${{ inputs.llm-review }}
        INPUT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        AI_STACK_USE_LLM: ${{ inputs.llm-review }}
        AI_STACK_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        AI_STACK_LLM_MODEL: ${{ inputs.llm-model }}
        AI_STACK_ENV_FILE: ""
      run: |
        if [ -n "$INPUT_LLM_API_KEY" ]; then
          export AI_STACK_LLM_API_KEY="$INPUT_LLM_API_KEY"
        fi
        args=(--path "$REVIEW_PATH" --markdown-output "$QUALITY_OUTPUT" --json-output "$QUALITY_JSON_OUTPUT" --fail-on "$FAIL_ON")
        if [ "$CHANGED_ONLY" = "true" ]; then
          args+=(--changed-only)
        fi
        if [ -n "$BASE_REF" ]; then
          args+=(--base-ref "$BASE_REF")
        fi
        if [ "$LLM_REVIEW" = "true" ]; then
          args+=(--llm-review)
        fi
        ai-stack-review "${args[@]}"
