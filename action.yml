name: AI Stack Mapper
description: Scan a Python repository for LLM/MCP/Tool/Agent-framework usage and produce Markdown and JSON reports.

inputs:
  path:
    description: Repository directory to scan.
    required: false
    default: "."

  markdown-output:
    description: Stack inventory Markdown report path.
    required: false
    default: "AI_STACK.md"

  json-output:
    description: Stack inventory JSON report path.
    required: false
    default: "ai-stack-report.json"

  enrich:
    description: >
      Enable optional LLM-powered enrichment for model purpose, usage
      description, and expected output. Disabled by default. Sends only
      code-derived context to the configured LLM endpoint.
    required: false
    default: "false"

  llm-api-key:
    description: >
      API key for optional LLM enrichment. Pass it using a GitHub Actions
      secret and never hardcode it in a workflow.
    required: false
    default: ""

  llm-base-url:
    description: >
      OpenAI-compatible API base URL. Leave blank to use the scanner's
      default endpoint.
    required: false
    default: ""

  llm-model:
    description: Model name used for optional LLM enrichment.
    required: false
    default: "gpt-4o-mini"

runs:
  using: composite
  steps:
    - name: Install AI Stack Mapper engine
      shell: bash
      run: |
        python -m pip install "${{ github.action_path }}/engine"

    - name: Run AI Stack Mapper
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        MARKDOWN_OUTPUT: ${{ inputs.markdown-output }}
        JSON_OUTPUT: ${{ inputs.json-output }}
        AI_STACK_USE_LLM: ${{ inputs.enrich }}
        AI_STACK_LLM_API_KEY: ${{ inputs.llm-api-key }}
        AI_STACK_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        AI_STACK_LLM_MODEL: ${{ inputs.llm-model }}
        AI_STACK_ENV_FILE: ""
      run: |
        ai-stack-scan \
          --path "$SCAN_PATH" \
          --format markdown \
          --output "$MARKDOWN_OUTPUT"

        ai-stack-scan \
          --path "$SCAN_PATH" \
          --format json \
          --output "$JSON_OUTPUT"